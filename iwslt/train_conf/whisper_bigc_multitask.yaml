# Model settings
model:
  name: "small"  # Options: tiny, base, small, medium, large

# Data paths
data:
  root: "corpora"

# Training settings
training:
  batch_size: 48
  num_workers: 4
  training_steps: 10000
  validate_steps: 1000
  learning_rate: 1.0e-5
  device: "cuda"
  mixed_precision: true
  gradient_accumulation_steps: 1
  validation_fraction: 0.05
  scheduler_step_strategy: "step"
  scheduler_config:
    name: "CosineAnnealingLR"
    params:
      eta_min: 1.0e-9

# Logging settings
logging:
  log_interval: 10

# WandB settings
wandb:
  enabled: true
  project: "whisper_bigc_multitask"
  run_name: "small_asr_ast"
  tags: ["whisper", "multitask", "swahili", "english"]

# Output settings
output:
  dir: "results/whisper_bigc_multitask"
  save_checkpoints: true